name: Testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v5
    - uses: actions/checkout@v4
      with:
        python-version: "3.12"
    - run: pip install -r requirements.txt
    - run: pip install pytest pytest-cov
    - run: pytest --cov=.